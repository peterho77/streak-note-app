[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "stevenho", email = "itaiseven7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic==2.10.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
